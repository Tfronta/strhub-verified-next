# STRhub Verified candidate, proposed by detect_recipe.
# Requires pinned upstream evidence and a strict procedure review.
# An origin label is not proof; unsupported procedures must not run.
tool:
  name: STRsearch
  version: c70179b
  contact: https://github.com/AnJingwd/STRsearch/issues
submission:
  by: third_party
source:
  repo: https://github.com/AnJingwd/STRsearch
  ref: c70179b3b175adc82a7314409af06900b3861d61
recipe:
  origin: proposed
report:
  slug: strsearch
environment:
  dockerfile: Dockerfile
  os:
  - ubuntu-22.04
  source: repository
  from_repo: Dockerfile
run:
  cmd: cd '.' && touch /tmp/.strhub_mark && ( python3 pipeline.py from_bam --working_path example/test_results --sample test --sex male --bam /data/in/input.bam --ref_bed example/ref_test.bed --genotypes example/test_results/test_genotypes.txt --multiple_alleles example/test_results/test_multiple_alleles.txt --qc_matrix example/test_results/test_qc_matrix.txt ); rc=$?; find . -xdev -type f -newer /tmp/.strhub_mark -size +0 ! -path './.git/*' ! -path './proc/*' ! -path './sys/*' ! -path './dev/*' ! -path './data/*' ! -path '*/__pycache__/*' ! -name '*.pyc' ! -name '*.pyo' 2>/dev/null | head -500 | while IFS= read -r f; do mkdir -p "/data/out/$(dirname "$f")" && cp "$f" "/data/out/$f"; done; exit $rc
  timeout_minutes: 20
inputs:
  type: illumina-bam-hg38
outputs:
- path: '**/*.t[sx][vt]'
  format: tsv
  min_records: 1
example:
  cmd: python3 pipeline.py from_fastq --working_path example/test_results/ --sample test --fq1 example/test_data/test_R1.fastq --fq2 example/test_data/test_R2.fastq --ref ucsc.hg19.fasta
  cwd: .
  source: detected
caveats:
  source: detect_recipe
  items:
  - 'Environment: the repository''s own Dockerfile is selected as-is, subject to the evidence check.'
  - 'Input: the README documents BAM and FASTQ (line 77); this plan selects STRhub''s illumina-bam-hg38 reference data.'
  - 'read_path: example/test_results/alignments/test.bam -> /data/in/input.bam.'
  - 'Run command: the README''s own command, rewritten to STRhub''s mounts; the capture wrapper is planned only if the procedure review passes.'
  - README mentions hg19/GRCh37 only; STRhub reference BAMs are hg38
