name: STRhub Verified

# The web finds a run by this name: a workflow_dispatch returns no run id, so
# the dispatch id rides in the run's name (docs/WEB-CONTRACT.md §1). Do not
# change its shape.
run-name: "Trial ${{ inputs.tool }} [${{ inputs.dispatch_id }}]"

# One run: read the public repository at the pinned commit, try to install and
# run the tool exactly as its author documents, and write down what happened.
# Nothing here forces a run. A gate that fails is a result, recorded with its
# exact command, exit status and log; nothing is tried in its place.
on:
  workflow_dispatch:
    inputs:
      tool:
        description: "The run's own name, e.g. trial-hipstr-v0.7; also the artifact's suffix"
        type: string
        required: true
      repo:
        description: "Public GitHub repository URL"
        type: string
        required: true
      ref:
        description: "Commit, tag or branch to pin; empty means the default branch"
        type: string
        required: false
        default: ""
      ref_label:
        description: "The ref as the user typed it (a tag or release), shown as the version"
        type: string
        required: false
        default: ""
      dispatch_id:
        description: "Correlation id echoed in the run's name"
        type: string
        required: false
        default: ""
      mode:
        description: "trial: the result stays the run's artifact. publish: an attestation"
        type: choice
        options: [trial, publish]
        default: trial
      publish:
        description: "'true' publishes the result to gh-pages when its verdict is about the tool; anything else keeps it private"
        type: string
        required: false
        default: "false"

# Granted per job, to the least it needs. Two jobs, on two machines, because
# installing and running a stranger's tool means executing a stranger's code
# (its Makefile, the tool itself; a Dockerfile it ships is never built):
#
#   verify   reads the repository, builds, runs and writes the report. Its
#            token can only READ this repository. Nothing on that machine can
#            write anywhere, whatever the code it ran managed to do.
#   publish  the only job that can write (to gh-pages). It never clones,
#            builds or runs anything of the author's: it downloads the report
#            as data, checks it again, and places it.
permissions: {}

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read         # checkout only; this job cannot write anywhere
    outputs:
      publishable: ${{ steps.attest.outputs.publishable }}
    env:
      TOOL: ${{ inputs.tool }}
      MODE: ${{ inputs.mode }}
    steps:
      # Before anything else: a run with no tool or no repository has nothing
      # to audit, and says so instead of going on under a made-up name.
      - name: Check the dispatch
        env:
          REPO: ${{ inputs.repo }}
        run: |
          if [ -z "$TOOL" ]; then
            echo "::error::no tool was given: dispatch with tool=<the run's name>, e.g. trial-hipstr-v0.7. There is no default tool."
            exit 1
          fi
          if ! printf '%s' "$TOOL" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "::error::tool must be a single safe name (letters, digits, '.', '_', '-'): got '$TOOL'"
            exit 1
          fi
          if [ -z "$REPO" ]; then
            echo "::error::no repository was given: dispatch with repo=<public GitHub repository URL>"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          # The token (read-only here) is not left in .git/config.
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml jsonschema pytest reportlab pillow

      # The harness is what every report rests on, so its tests gate every
      # run: a regression in a gate check or a diagnostic rule stops here,
      # before it can be written down as a finding about someone's software.
      - name: Harness tests
        run: python -m pytest harness/tests -q

      # --- Read the repository ------------------------------------------------
      - id: propose
        name: "Read the documented procedure from the repository"
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAL_REPO: ${{ inputs.repo }}
          TRIAL_REF: ${{ inputs.ref }}
          TRIAL_REF_LABEL: ${{ inputs.ref_label }}
        run: |
          mkdir -p work
          python harness/detect_recipe.py "$TRIAL_REPO" "$TRIAL_REF" --tag "$TRIAL_REF_LABEL" \
            --json recipe_proposal.json
          python harness/propose_manifest.py recipe_proposal.json --slug "$TOOL" \
            --ref-label "$TRIAL_REF_LABEL" \
            --out-dir work/proposal

      - id: m
        name: Prepare the procedure and the shared dataset
        run: |
          python harness/prepare.py "$TOOL" --work work --mode "$MODE" \
            --proposal recipe_proposal.json --plan-out work/plan.json >> "$GITHUB_OUTPUT"

      # --- Reference genome ------------------------------------------------------
      # Only when the documented command names a reference genome and the
      # registered dataset is aligned to one (prepare says reference_ready).
      # It is a public, standard file no repository ships: STRhub supplies it,
      # read-only at /data/ref, the way it supplies the sample. The download is
      # checked against the checksum its provider publishes, then cached.
      - name: Cache the reference genome
        if: steps.m.outputs.reference_ready == '1'
        uses: actions/cache@v4
        id: ref-cache
        with:
          path: work/ref
          key: ref-${{ steps.m.outputs.ref_genome_filename }}-v2

      - id: ref_dl
        name: Download and index the reference genome
        if: steps.m.outputs.reference_ready == '1' && steps.ref-cache.outputs.cache-hit != 'true'
        env:
          REF_GENOME_URL: ${{ steps.m.outputs.ref_genome_url }}
          REF_GENOME_MD5_URL: ${{ steps.m.outputs.ref_genome_md5_url }}
          REF_GENOME_FILE: ${{ steps.m.outputs.ref_genome_filename }}
        run: |
          set -euo pipefail
          mkdir -p work/ref
          archive="work/ref/$(basename "$REF_GENOME_URL")"
          curl -fsSL -o "$archive" "$REF_GENOME_URL"
          expected=$(curl -fsSL "$REF_GENOME_MD5_URL" | awk -v f="$(basename "$REF_GENOME_URL")" '$2 == f {print $1}')
          test -n "$expected" || { echo "::error::the provider publishes no checksum for $(basename "$REF_GENOME_URL")"; exit 1; }
          echo "$expected  $archive" | md5sum -c -
          gunzip -c "$archive" > "work/ref/$REF_GENOME_FILE"
          rm -f "$archive"
          sudo apt-get install -y -qq samtools >/dev/null
          samtools faidx "work/ref/$REF_GENOME_FILE"
          ls -lh work/ref/

      # --- The gates: harness/engine -------------------------------------------
      # Available, Installs, the example leg and its check, the external leg
      # and its checks. The tool runs as a container built from the one
      # environment the review admits, with the registered dataset (and the
      # reference genome, when the command names one) mounted read-only, no
      # network, a memory and CPU ceiling, a process cap and no
      # capabilities (stages.HARDENING).
      #
      # The runner exits 0 whatever the gates found: a failed gate is a result,
      # written to run_record.json. A non-zero exit here is the runner itself
      # crashing, which the report counts as a fault of STRhub's
      # (INFRA_FAILURE), never as the tool's.
      - id: engine
        name: "Gates · Available, Installs, Example, Runs, IO, Content"
        continue-on-error: true
        run: python -m harness.engine run --plan work/plan.json --work work --record run_record.json

      # --- The report (always) ---------------------------------------------------
      - id: attest
        name: Build the report and decide whether it is published
        if: always() && steps.m.outcome == 'success'
        env:
          MANIFEST: ${{ steps.m.outputs.manifest }}
          TOOL_REF: ${{ steps.m.outputs.ref }}
          # A step of STRhub's own that failed. The gates below it did not run
          # and would otherwise read as the tool stopping.
          INFRA_FAILURE: ${{ steps.m.outputs.input_failure || (steps.ref_dl.outcome == 'failure' && 'the reference genome download') || (steps.engine.outcome == 'failure' && 'the gate runner') || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLISH: ${{ inputs.publish == 'true' && 'true' || 'false' }}
          # This job's read-only token, for the upstream check: raises the API allowance.
          GH_TOKEN: ${{ github.token }}
        run: |
          python harness/report.py \
            --manifest "$MANIFEST" \
            --engine-record run_record.json \
            --procedure-review work/procedure_review.json \
            --mounted-inputs work/mounted_inputs.json \
            --matrix matrix.json \
            --example example.json \
            --log-build work/log_build.txt \
            --log-example work/log_example.txt \
            --log-external work/log_external.txt \
            --recipe-proposal recipe_proposal.json \
            --ref "$TOOL_REF" \
            --check-upstream \
            --mode "$MODE" \
            --infra-failure "$INFRA_FAILURE" \
            --run-url "$RUN_URL"
          # The one report this run wrote, and the slug it was written under.
          REPORT_JSON=$(ls reports/*.json | grep -v -e '\.badge\.json$' -e '\.recipe\.json$' | head -1)
          SLUG=$(basename "$REPORT_JSON" .json)
          echo "report=$REPORT_JSON" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          # Whose card a published run would land on is read off the live
          # catalogue. Unreadable means not published: publish_gate fails closed.
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/index.json" \
            -o published_index.json || rm -f published_index.json
          python harness/publish_gate.py --report "$REPORT_JSON" --slug "$SLUG" --index published_index.json \
            | tee -a "$GITHUB_OUTPUT"

      # The manifest and Dockerfile the run used travel with the report.
      - name: Attach the recipe the run used
        if: always() && steps.attest.outcome == 'success'
        env:
          DOCKER_DIR: ${{ steps.m.outputs.dockerdir }}
        run: >-
          python harness/attach_recipe.py "$TOOL" --dockerdir "$DOCKER_DIR" --proposal recipe_proposal.json
          --procedure-review work/procedure_review.json --source-install-dockerfile work/source-install.Dockerfile

      - name: Generate the PDF
        if: always() && steps.attest.outcome == 'success'
        continue-on-error: true
        env:
          MANIFEST: ${{ steps.m.outputs.manifest }}
          # The PDF marks a result that will not be published and links one
          # that will: the publish gate's decision, not the run's mode.
          PUBLISHABLE: ${{ steps.attest.outputs.publishable || 'false' }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: |
          python harness/generate_pdf.py \
            --manifest "$MANIFEST" \
            --publishable "$PUBLISHABLE" \
            --dispatch-id "$DISPATCH_ID"

      # What the web reads (docs/WEB-CONTRACT.md §2): the report and its files
      # under reports/, and every stage's command, exit status and log.
      - name: Upload attestation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.mode == 'trial' && 'trial' || 'attestation' }}-${{ inputs.tool }}
          path: |
            reports/
            run_record.json
          retention-days: ${{ inputs.mode == 'trial' && 30 || 90 }}

      # Inert here: this workflow has no pull_request trigger. Kept as it was,
      # pending the owner's decision on it (docs/INVENTARIO-2026-11-12.md).
      - name: "PR check · no regression against the published level"
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json, pathlib, sys, urllib.request
          ladder = ["none", "available", "installs", "runs", "io", "content"]
          reports = [p for p in pathlib.Path("reports").glob("*.json")
                     if not p.name.endswith((".badge.json", ".recipe.json"))]
          if not reports:
              print("no report produced"); sys.exit(0)
          r = json.loads(reports[0].read_text())
          slug = (r.get("report") or {}).get("slug") or reports[0].stem
          try:
              with urllib.request.urlopen(
                  "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/index.json", timeout=20) as f:
                  published = {t["slug"]: t["level"] for t in json.load(f)["tools"]}
          except Exception as exc:
              print(f"could not read the published catalogue ({exc}); nothing to compare against"); sys.exit(0)
          was, now = published.get(slug, "none"), r.get("level", "none")
          print(f"{slug}: published={was} this run={now}")
          if ladder.index(now) < ladder.index(was):
              print(f"::error::{slug} regressed from '{was}' to '{now}' in this pull request")
              sys.exit(1)
          PY

  # --- Publication -------------------------------------------------------------------
  # Only on main (gh-pages IS production, and the web dispatches on main), only
  # when the dispatch asked for it, and only when publish_gate says so: the
  # verdict is about the tool or its documentation, the procedure evidence
  # validates, and the card belongs to this repository.
  #
  # This job trusts nothing the other one decided. It takes the report as a
  # file, runs publish_gate on it again here, and publish_layout validates it
  # once more before placing it. No step below executes anything that came
  # from the author's repository.
  publish:
    needs: verify
    if: always() && inputs.publish == 'true' && needs.verify.outputs.publishable == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write        # pushes the report to gh-pages
    env:
      TOOL: ${{ inputs.tool }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml jsonschema

      - name: Download the report
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.mode == 'trial' && 'trial' || 'attestation' }}-${{ inputs.tool }}
          path: artifact

      - id: gate
        name: Decide again, here, whether the report is published
        env:
          PUBLISH: "true"
        run: |
          REPORT_JSON=$(ls artifact/reports/*.json | grep -v -e '\.badge\.json$' -e '\.recipe\.json$' | head -1)
          SLUG=$(basename "$REPORT_JSON" .json)
          printf '%s' "$SLUG" | grep -Eq '^[a-z0-9][a-z0-9._-]*$' || { echo "::error::the report's slug is not a safe name"; exit 1; }
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/index.json" \
            -o published_index.json || rm -f published_index.json
          python harness/publish_gate.py --report "$REPORT_JSON" --slug "$SLUG" --index published_index.json \
            | tee -a "$GITHUB_OUTPUT"

      # The run's files go to <slug>/<sha>/ and the root <slug>.* set is an
      # alias of the newest commit verified (harness/publish_layout.py).
      #
      # The loop below repeats the PUSH, never the run: two dispatches can
      # finish together and both rewrite index.json, so a lost race is redone
      # from a fresh clone of the branch, and running out of attempts fails
      # the step.
      - name: Deploy the report to gh-pages
        if: steps.gate.outputs.publishable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.gate.outputs.slug }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # Every command carries its own `|| return 1`: `publish` is called as
          # an `if` condition, where bash ignores `set -e` all the way down.
          publish() {
            tmp="$(mktemp -d)" || return 1
            if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
              git clone -q --depth 1 --branch gh-pages "$remote" "$tmp" || return 1
            else
              git clone -q --depth 1 "$remote" "$tmp" || return 1
              git -C "$tmp" checkout -q --orphan gh-pages || return 1
              git -C "$tmp" rm -rfq . || true
            fi
            python harness/publish_layout.py "$tmp" --reports artifact/reports --slug "$SLUG" || return 1
            touch "$tmp/.nojekyll" || return 1
            python harness/build_index.py "$tmp" --out "$tmp/index.html" || return 1
            git -C "$tmp" add -A || return 1
            if git -C "$tmp" diff --cached --quiet; then echo "no changes to publish"; return 0; fi
            git -C "$tmp" commit -q -m "deploy ${TOOL} @ run ${{ github.run_id }}" || return 1
            git -C "$tmp" push "$remote" gh-pages
          }
          for i in 1 2 3 4 5; do
            if publish; then exit 0; fi
            echo "push attempt $i did not land (most likely a race with another run)"
            sleep $((i * 2 + RANDOM % 6))
          done
          echo "::error::could not publish the report for $TOOL to gh-pages after 5 attempts"
          exit 1
